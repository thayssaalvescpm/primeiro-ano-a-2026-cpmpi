name: Publicar jogos no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar Pygbag
        run: python -m pip install --upgrade pygbag

      - name: Preparar pasta do site
        run: |
          mkdir -p site/jogos
          test -f index.html || {
            echo "ERRO: index.html não encontrado"
            exit 1
          }
          cp index.html site/index.html

      - name: Compilar jogos
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          pastas=(jogos/*/)

          if [ ${#pastas[@]} -eq 0 ]; then
            echo "ERRO: nenhuma pasta de jogo encontrada em jogos/"
            exit 1
          fi

          for d in "${pastas[@]}"; do
            nome=$(basename "$d")

            echo "=================================="
            echo "Compilando jogo: $nome"
            echo "=================================="

            if [ ! -f "$d/main.py" ]; then
              echo "ERRO: $d/main.py não encontrado"
              exit 1
            fi

            python -m pygbag --build "$d"

            origem="$d/build/web"
            destino="site/jogos/$nome"

            if [ ! -f "$origem/index.html" ]; then
              echo "ERRO: o Pygbag não gerou $origem/index.html"
              find "$d/build" -maxdepth 3 -type f 2>/dev/null || true
              exit 1
            fi

            mkdir -p "$destino"
            cp -r "$origem/." "$destino/"

            echo "OK: $nome publicado em $destino"
          done

          echo "Todos os jogos foram compilados."

      - name: Verificar arquivos publicados
        run: |
          echo "Arquivos gerados:"
          find site -maxdepth 4 -type f | sort

          test -f site/index.html

          for pagina in site/jogos/*/index.html; do
            if [ ! -f "$pagina" ]; then
              echo "ERRO: página HTML não encontrada"
              exit 1
            fi
            echo "OK: $pagina"
          done

      - name: Enviar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4